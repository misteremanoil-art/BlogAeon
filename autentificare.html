<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare — Blog Aeon</title>
    <link rel="stylesheet" href="style.css">
     <!-- 1. Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. script.js (creează window.supabaseClient) -->
    <script src="script.js"></script>
    <!-- 3. auth.js (folosește window.supabaseClient) -->
    <script src="auth.js"></script>
</body>

</head>
<body>
    <header>
    <div class="site-header">
        <!-- STÂNGA: Bara de căutare -->
        <div class="header-left">
            <form action="cautare.html" method="GET" class="search-trigger-container" id="search-form">
                <input type="search" name="q" placeholder="Caută..." class="expandable-search" id="search-input" autocomplete="off">
                <label for="search-input" class="search-label" aria-label="Deschide căutarea">
                    <svg class="lupa-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </label>
            </form>
        </div>

        <!-- CENTRU: Logo simplu și elegant -->
        <a href="index.html" class="logo">Albert-Beniamin Cucu</a>

        <!-- DREAPTA: Navigație -->
        <nav class="header-right">
            <a href="index.html">Acasă</a>
            <a href="blog.html">Articole</a>
            <a href="despre.html">Despre</a>
            <!-- În interiorul <nav class="header-right"> -->
<a href="autentificare.html" id="auth-link-header">Logare</a>

<!-- Include scriptul de sesiune la finalul fiecărui HTML -->
<script src="auth-session.js"></script>
    </nav>
    </div>
</header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div id="success-banner">✓ Cont creat cu succes! Te redirecționăm...</div>
            <h1 id="auth-title">Conectare</h1>
            <p id="auth-desc">Bine ai revenit la Blog Aeon.</p>

            <form id="auth-form-internal">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Adresa de email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Parola" required>
                </div>
                <button type="submit" id="main-btn" class="btn-auth">Intră în cont</button>
            </form>

            <div class="toggle-text">
                <span id="switch-msg">Nu ai un cont?</span> 
                <span class="toggle-link" id="toggle-btn">Creează unul</span>
            </div>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- AICI FACEM LEGĂTURA CU FIȘIERUL JS -->
    <script src="auth.js"></script>
</body>
</html>
