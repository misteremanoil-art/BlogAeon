<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare — Blog Aeon</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <!-- Header-ul tău rămâne neschimbat -->
        <div class="site-header">
            <a href="index.html" class="logo">Albert-Beniamin Cucu</a>
            <!-- ... restul header-ului ... -->
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div id="success-banner">✓ Cont creat cu succes! Te redirecționăm...</div>
            <h1 id="auth-title">Conectare</h1>
            <p id="auth-desc">Bine ai revenit la Blog Aeon.</p>

            <form id="auth-form-internal">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Adresa de email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Parola" required>
                </div>
                <button type="submit" id="main-btn" class="btn-auth">Intră în cont</button>
            </form>

            <div class="toggle-text">
                <span id="switch-msg">Nu ai un cont?</span> 
                <span class="toggle-link" id="toggle-btn">Creează unul</span>
            </div>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- AICI FACEM LEGĂTURA CU FIȘIERUL JS -->
    <script src="auth.js"></script>
</body>
</html>
