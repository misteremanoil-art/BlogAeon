<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare — Blog Aeon</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 40px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }
        .auth-container h1 {
            text-align: center;
            margin-bottom: 10px;
            font-family: var(--serif);
        }
        .auth-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 1rem;
        }
        .auth-form button {
            padding: 14px;
            background: #4a4743;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-switch {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
        }
        .auth-switch a {
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            color: #c2410c;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <header>
        <div class="site-header">
            <a href="index.html" class="logo">Albert-Beniamin Cucu</a>
            <div class="header-actions">
                <nav>
                    <a href="index.html">Acasă</a>
                    <a href="blog.html">Articole</a>
                    <a href="despre.html">Despre</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h1 id="auth-title">Conectare</h1>
            <p id="auth-subtitle" class="auth-subtitle">Intră în contul tău pentru a accesa conținut exclusiv.</p>

            <form id="auth-form" class="auth-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Parolă" required>
                <button type="submit" id="submit-btn">Intră în cont</button>
            </form>

            <div class="auth-switch">
                <span id="switch-text">Nu ai cont?</span>
                <a href="#" id="switch-auth">Creează unul</a>
            </div>

            <p id="error-message" class="error" style="display: none;"></p>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
