<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare — Blog Aeon</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <!-- Aici pui header-ul tău centered pe care l-am făcut anterior -->
    </header>

    <main class="container-reading">
        <section id="auth-container" class="card" style="max-width: 400px; margin: 60px auto; padding: 40px;">
            <h1 id="auth-title" style="text-align: center; margin-bottom: 30px;">Conectare</h1>
            
            <form id="auth-form" style="display: flex; flex-direction: column; gap: 20px;">
                <input type="email" id="email" placeholder="Email" class="expandable-search" style="width: 100%; opacity: 1; visibility: visible; border-bottom: 1px solid var(--line) !important;" required>
                <input type="password" id="password" placeholder="Parolă" class="expandable-search" style="width: 100%; opacity: 1; visibility: visible; border-bottom: 1px solid var(--line) !important;" required>
                
                <button type="submit" id="submit-btn" class="tag-chip" style="padding: 12px; background: var(--text-main); color: white; cursor: pointer; border: none; font-weight: 600;">Intră în cont</button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
                <span id="switch-text">Nu ai cont?</span> 
                <a href="#" id="switch-auth" style="text-decoration: underline; color: var(--accent);">Creează unul</a>
            </p>
        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
