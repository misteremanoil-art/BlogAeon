<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare — Blog Aeon</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: #fffdfa;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(17, 17, 17, 0.08);
            box-shadow: 0 20px 42px rgba(15, 23, 42, 0.08);
        }
        .auth-card h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #4a4743;
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-card p {
            text-align: center;
            color: #74716b;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(17, 17, 17, 0.1);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #b45309; }
        
        .btn-auth {
            width: 100%;
            padding: 14px;
            background: #4a4743;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-auth:hover { background: #33312e; transform: translateY(-1px); }
        .btn-auth:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .toggle-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #74716b;
        }
        .toggle-link {
            color: #b45309;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        /* Mesaje de stare */
        #error-msg {
            background: #fef2f2;
            color: #991b1b;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            border: 1px solid #fecaca;
            display: none;
        }
        #success-msg {
            background: #ecfdf5;
            color: #065f46;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            border: 1px solid #a7f3d0;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="site-header">
            <a href="index.html" class="logo">Albert-Beniamin Cucu</a>
            <nav class="header-right">
                <a href="index.html">Acasă</a>
                <a href="blog.html">Articole</a>
                <a href="despre.html">Despre</a>
            </nav>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 id="auth-title">Conectare</h1>
            <p id="auth-desc">Bine ai revenit la Blog Aeon.</p>

            <form id="auth-form-internal">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Adresa de email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Parola" required>
                </div>
                <button type="submit" id="main-btn" class="btn-auth">Intră în cont</button>
            </form>

            <div class="toggle-text">
                <span id="switch-msg">Nu ai un cont?</span> 
                <span class="toggle-link" id="toggle-btn">Creează unul</span>
            </div>
            
            <!-- Mesajele apar aici -->
            <div id="success-msg"></div>
            <div id="error-msg"></div>
        </div>
    </div>

    <script>
        // CONFIGURARE SUPABASE
        const SUPABASE_URL = 'https://wlqdalqyrlmehkqwvviy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ejSs6WkxzS_BzoqSjUMInw_-vqKAdE_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const toggleBtn = document.getElementById('toggle-btn');
        const authTitle = document.getElementById('auth-title');
        const authDesc = document.getElementById('auth-desc');
        const mainBtn = document.getElementById('main-btn');
        const switchMsg = document.getElementById('switch-msg');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const authForm = document.getElementById('auth-form-internal');

        let isLoginMode = true;

        // FUNCȚIE PENTRU SCHIMBARE MOD (LOGIN/REGISTER)
        function toggleMode() {
            isLoginMode = !isLoginMode;
            errorMsg.style.display = "none";
            successMsg.style.display = "none";
            
            if (isLoginMode) {
                authTitle.innerText = "Conectare";
                authDesc.innerText = "Bine ai revenit la Blog Aeon.";
                mainBtn.innerText = "Intră în cont";
                switchMsg.innerText = "Nu ai un cont?";
                toggleBtn.innerText = "Creează unul";
            } else {
                authTitle.innerText = "Creare Cont";
                authDesc.innerText = "Alătură-te comunității noastre teologice.";
                mainBtn.innerText = "Înregistrare";
                switchMsg.innerText = "Ai deja un cont?";
                toggleBtn.innerText = "Conectează-te";
            }
        }

        toggleBtn.addEventListener('click', toggleMode);

        // LOGICA DE SUBMIT (LOGIN & REGISTER)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Resetăm stările
            errorMsg.style.display = "none";
            successMsg.style.display = "none";
            mainBtn.disabled = true;
            const originalBtnText = mainBtn.innerText;
            mainBtn.innerText = "Se procesează...";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (isLoginMode) {
                    // --- LOGIN ---
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    
                    successMsg.innerText = "Conectare reușită! Te redirecționăm...";
                    successMsg.style.display = "block";
                    setTimeout(() => { window.location.href = "index.html"; }, 1500);

                } else {
                    // --- REGISTER ---
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;

                    // Dacă tot primești eroare de confirmare, înseamnă că userul existat deja.
                    // Succes vizual:
                    successMsg.innerText = "Cont creat cu succes! Te poți conecta acum.";
                    successMsg.style.display = "block";
                    
                    // Resetăm parola și mutăm la Login după 2 secunde
                    setTimeout(() => {
                        document.getElementById('password').value = "";
                        toggleMode();
                        mainBtn.disabled = false;
                    }, 2000);
                }
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.style.display = "block";
                mainBtn.disabled = false;
                mainBtn.innerText = originalBtnText;
            }
        });
    </script>
</body>
</html>
