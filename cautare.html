<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Caută articole pe BlogAeon — Albert-Beniamin Cucu.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://misteremanoil-art.github.io/BlogAeon/cautare.html">
    <meta property="og:title" content="Căutare — Albert-Beniamin Cucu">
    <meta property="og:description" content="Caută articole despre teologie, credință și viață spirituală.">
    <meta property="og:site_name" content="BlogAeon — Albert-Beniamin Cucu">

    <title>Rezultate Căutare — Albert-Beniamin Cucu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="site-header">
            <div class="header-left">
                <form action="cautare.html" method="GET" class="search-trigger-container" id="search-form">
                    <input type="search" name="q" placeholder="Caută..." class="expandable-search" id="search-input" autocomplete="off">
                    <label for="search-input" class="search-label" aria-label="Deschide căutarea">
                        <svg class="lupa-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </label>
                </form>
            </div>
            <a href="index.html" class="logo">Albert-Beniamin Cucu</a>
            <nav class="header-right" id="main-nav">
                <a href="index.html">Acasă</a>
                <a href="blog.html">Articole</a>
                <a href="despre.html">Despre</a>
            </nav>
            <!-- Buton hamburger pentru mobil -->
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Deschide meniul" aria-expanded="false" aria-controls="mobile-menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
        <!-- Meniu mobil -->
        <nav class="mobile-menu" id="mobile-menu" aria-hidden="true">
            <a href="index.html">Acasă</a>
            <a href="blog.html">Articole</a>
            <a href="despre.html">Despre</a>
        </nav>
    </header>

    <main class="container-reading" style="margin-top: 50px;">
        <h1 id="search-title">Căutare...</h1>
        <div id="results-list" class="related-grid" style="grid-template-columns: 1fr; gap: 20px;">
            <!-- Rezultatele vor apărea aici -->
        </div>
        <div id="no-results" style="display:none; text-align: center; margin-top: 40px; padding: 40px 20px;">
            <p style="font-family: var(--serif); font-size: 1.4rem; color: #4a4743; margin-bottom: 12px;">Ne pare rău, niciun articol nu corespunde căutării tale.</p>
            <p style="color: var(--muted); margin-bottom: 24px;">Încearcă un alt termen sau explorează toate articolele.</p>
            <a href="blog.html" style="color: var(--accent); text-decoration: underline; font-weight: 600;">Vezi toate articolele →</a>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <span>Albert-Beniamin Cucu</span>
            <div class="footer-links">
                <a href="index.html">Acasă</a>
                <a href="blog.html">Articole</a>
                <a href="despre.html">Despre</a>
            </div>
            <span>© 2026</span>
        </div>
    </footer>

    <button class="back-to-top" type="button" aria-label="Înapoi sus">↑</button>

    <script>
        // ===== NORMALIZARE DIACRITICE =====
        // Elimină diacriticele pentru căutare tolerantă (ă→a, â→a, î→i, ș→s, ț→t etc.)
        function normalizeDiacritics(str) {
            return str
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase();
        }

        const articoleDB = [
            {
                titlu: "Chemarea divină și răspunsul nostru",
                descriere: "Pilda scuzelor din Luca 14 și importanța de a răspunde chemării lui Dumnezeu.",
                url: "articol-chemarea-divina.html",
                tags: "chemare pilda luca teologie har dumnezeu"
            },
            {
                titlu: "Rugăciunea, între egocentrism și teocentrism",
                descriere: "Cum rugăciunea personală poate deveni centrată pe sine sau pe voia lui Dumnezeu.",
                url: "rugaciunea-egocentrism-si-teocentrism.html",
                tags: "rugaciune teologie matei egocentrism teocentrism"
            },
            {
                titlu: "Redescoperind Comuniunea Personală",
                descriere: "Un ghid practic în trei pași pentru o rugăciune personală profundă.",
                url: "redescoperind-comuniunea-personala.html",
                tags: "rugaciune pastor ghid comuniune personala matei"
            },
            {
                titlu: "Rediscovering Personal Communion",
                descriere: "A pastor's three-step guide to personal prayer based on Matthew 6:6.",
                url: "rediscovering-personal-communion.html",
                tags: "prayer ministry guide communion personal matthew"
            }
        ];

        function initializarePagina() {
            const resultsContainer = document.getElementById('results-list');
            const titleElement = document.getElementById('search-title');
            const noResults = document.getElementById('no-results');

            const urlParams = new URLSearchParams(window.location.search);
            const rawQuery = urlParams.get('q')?.trim() || "";
            const query = normalizeDiacritics(rawQuery);

            if (!rawQuery) {
                titleElement.innerText = "Introdu un termen pentru a căuta.";
                return;
            }

            titleElement.innerText = `Rezultate pentru: "${rawQuery}"`;

            const filtrate = articoleDB.filter(a => {
                const titluNorm = normalizeDiacritics(a.titlu);
                const descriereNorm = normalizeDiacritics(a.descriere);
                const tagsNorm = normalizeDiacritics(a.tags);
                return titluNorm.includes(query) || 
                       descriereNorm.includes(query) ||
                       tagsNorm.includes(query);
            });

            if (filtrate.length > 0) {
                resultsContainer.innerHTML = filtrate.map(a => `
                    <a href="${a.url}" class="card" style="display: block; text-decoration: none; padding: 25px; border: 1px solid rgba(0,0,0,0.08); border-radius: 15px; margin-bottom: 15px;">
                        <h3 style="margin: 0 0 10px 0; color: #4a4743;">${a.titlu}</h3>
                        <p style="margin: 0; color: rgba(74,71,67,0.7); font-size: 0.95rem;">${a.descriere}</p>
                    </a>
                `).join('');
            } else {
                noResults.style.display = "block";
            }
        }

        window.onload = initializarePagina;
    </script>
    <script src="script.js"></script>
</body>
</html>
