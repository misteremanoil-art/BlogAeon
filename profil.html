<div class="auth-card" style="max-width: 600px;">
    <h1>Contul Meu</h1>
    <p id="user-email-display" style="color: var(--accent); font-weight: 700;"></p>
    
    <div style="margin-top: 30px; text-align: left;">
        <h3 style="font-family: var(--serif); margin-bottom: 15px;">Articole citite recent</h3>
        <div id="reading-history-list" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Aici apar articolele din localStorage -->
        </div>
    </div>

    <button id="logout-btn" class="btn-auth" style="margin-top: 40px; background: #991b1b;">Ieșire din cont</button>
</div>

<script>
    // Codul pentru afișarea istoricului
    const historyList = document.getElementById('reading-history-list');
    const history = JSON.parse(localStorage.getItem('reading_history') || '[]');

    if (history.length > 0) {
        historyList.innerHTML = history.map(item => `
            <a href="${item.url}" style="padding: 15px; background: #f9f8f6; border-radius: 10px; border: 1px solid var(--line); font-size: 0.9rem;">
                ${item.title}
            </a>
        `).join('');
    } else {
        historyList.innerHTML = "<p style='font-size: 0.8rem; color: gray;'>Nu ai citit niciun articol încă.</p>";
    }
</script>
