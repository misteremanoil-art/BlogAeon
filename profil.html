<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilul Meu — Albert-Beniamin Cucu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Core -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="site-header">
            <div class="header-left">
                <form action="cautare.html" method="GET" class="search-trigger-container" id="search-form">
                    <input type="search" name="q" placeholder="Caută..." class="expandable-search" id="search-input" autocomplete="off">
                    <label for="search-input" class="search-label">
                        <svg class="lupa-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </label>
                </form>
            </div>
            <a href="index.html" class="logo">Albert-Beniamin Cucu</a>
            <nav class="header-right">
                <a href="index.html">Acasă</a>
                <a href="blog.html">Articole</a>
                <a href="despre.html">Despre</a>
                <a href="autentificare.html" id="auth-link-header">Logare</a>
            </nav>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <p class="eyebrow" style="text-align: center;">Gestionare Cont</p>
            <h1 style="text-align: center; margin-bottom: 10px;">Profilul Meu</h1>
            <p id="user-email-display" style="text-align: center; color: var(--accent); font-weight: 700; margin-bottom: 30px;"></p>
            
            <div style="margin-top: 20px; text-align: left;">
                <h3 style="font-family: var(--serif); font-size: 1.3rem; margin-bottom: 15px; color: var(--text-main);">Articole citite recent</h3>
                <div id="reading-history-list" style="display: flex; flex-direction: column; gap: 12px;">
                    <!-- Articolele apar aici din script -->
                </div>
            </div>

            <div style="margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px;">
                <button id="logout-btn" class="btn-auth" style="background: #991b1b; width: 100%;">Ieșire din cont</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // LOGICA SPECIFICĂ PAGINII DE PROFIL
        async function initProfile() {
            // Așteptăm ca Supabase să fie inițializat în script.js
            const client = window.supabaseClient;
            
            const { data: { user } } = await client.auth.getUser();
            
            if (!user) {
                window.location.href = "autentificare.html";
                return;
            }

            // Afișăm emailul
            document.getElementById('user-email-display').innerText = user.email;

            // Afișăm istoricul de lectură din LocalStorage
            const historyList = document.getElementById('reading-history-list');
            const history = JSON.parse(localStorage.getItem('reading_history') || '[]');

            if (history.length > 0) {
                historyList.innerHTML = history.map(item => `
                    <a href="${item.url}" class="card" style="padding: 15px; text-decoration: none; display: block; border-radius: 12px; transition: transform 0.2s;">
                        <span style="font-family: var(--serif); font-weight: 600; color: var(--text-main);">${item.title}</span>
                    </a>
                `).join('');
            } else {
                historyList.innerHTML = "<p style='font-size: 0.85rem; color: var(--text-muted); text-align: center;'>Nu ai citit niciun articol încă.</p>";
            }

            // Buton de Logout
            document.getElementById('logout-btn').onclick = async () => {
                await client.auth.signOut();
                localStorage.removeItem('reading_history'); // Curățăm istoricul la ieșire (opțional)
                window.location.href = "index.html";
            };
        }

        document.addEventListener('DOMContentLoaded', initProfile);
    </script>
</body>
</html>
