    <main class="container-reading">
        <div class="essay-header">
            <p class="eyebrow">Despre site</p>
            <h1>Albert-Beniamin Cucu</h1>
            <p class="standfirst">Un blog de teologie și reflecție, scris cu ton sobru, clar și atent la sensul lucrurilor care contează.</p>
        </div>

        <img src="https://picsum.photos/id/1025/400/400" alt="Portret al lui Albert-Beniamin Cucu, autorul blogului" style="width:220px; height:220px; border-radius:50%; display:block; margin:0 auto 50px; filter:grayscale(100%);" loading="lazy">

        <div class="essay-content">
            <p class="drop-cap">Sunt Albert-Beniamin Cucu și scriu despre credință, viață și lucrurile care mă ocupă de fapt zi de zi. Nu mă interesează cuvintele pompoase; mă interesează să spun adevărul așa cum îl simt și îl înțeleg.</p>
            <p>Pe acest site îmi pun în pagină gândurile care mi-au rămas după rugăciune, după discuții serioase și după zile în care am avut nevoie de liniște. Vreau să fie clar, sincer și aproape de realitatea oamenilor.</p>
            <p>Dacă ai ajuns aici, probabil că cauți un text care vorbește direct, fără artificii. Asta încerc să ofer: un mod simplu de a gândi despre credință, responsabilitate, durere și speranță.</p>
        </div>

        <section class="mission-grid" aria-label="Misiunea blogului">
            <article class="highlight-card">
                <h3>Misiune</h3>
                <p>Construim un spațiu de lectură calm, bazat pe seriozitate, claritate și respect față de oamenii care caută sens.</p>
            </article>
            <article class="highlight-card">
                <h3>Ton</h3>
                <p>Textul este sobru, editorial și profund, fără fasoane, cu grijă pentru ritmul lecturii și pentru calitatea ideilor.</p>
            </article>
            <article class="highlight-card">
                <h3>Teme</h3>
                <p>Teologie, patristică, spiritualitate, rugăciune, durere, speranță și viața de zi cu zi văzute în lumină credinței.</p>
            </article>
        </section>
